[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-multi-pair-rl"
version = "0.1.0"
description = "Safe reinforcement learning execution for dynamic cryptocurrency pair trading"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.4", "torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
